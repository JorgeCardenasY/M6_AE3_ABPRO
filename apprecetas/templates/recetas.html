{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Nuestras Recetas</h1>
    <div class="row">
        {% for receta in recetas %}
        <div class="col-md-4">
            <div class="card mb-4">
                {% if receta.imagen %}
                <img src="{{ receta.imagen.url }}" class="card-img-top" alt="{{ receta.nombre }}">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ receta.nombre }}</h5>
                    <p class="card-text">{{ receta.ingredientes|truncatewords:20 }}</p>
                    <a href="#" class="btn btn-primary">Ver Receta</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
